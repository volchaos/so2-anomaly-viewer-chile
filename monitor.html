<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SO₂ Monitor · Chile</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      background: #0f1117;
      overflow: hidden;
      font-family: 'DM Sans', system-ui, sans-serif;
    }

    #map { height: 100vh; width: 100vw; }

    /* ── HUD ── */
    .hud {
      position: fixed;
      top: 16px; left: 16px;
      background: rgba(15, 17, 23, 0.95);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 12px;
      padding: 14px 16px;
      z-index: 900;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 28px rgba(0,0,0,0.55);
      width: 210px;
    }
    /* Línea de acento superior */
    .hud::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, #e6a032, transparent 70%);
      border-radius: 12px 12px 0 0;
    }

    .hud-zone {
      font-size: 10px; font-weight: 700;
      color: #e6a032;
      text-transform: uppercase; letter-spacing: 0.12em;
      font-family: 'IBM Plex Mono', monospace;
    }
    .hud-product {
      font-size: 13px; font-weight: 600;
      color: #e2e8f0;
      margin-top: 2px; letter-spacing: -0.01em;
    }

    .hud-sep {
      border: none; border-top: 1px solid rgba(255,255,255,0.07);
      margin: 10px 0;
    }

    .hud-date {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 22px; font-weight: 600;
      color: #e2e8f0; letter-spacing: 0.02em;
      line-height: 1.1;
    }
    .hud-nav {
      display: flex; gap: 5px; margin-top: 8px;
    }
    .hud-btn {
      flex: 1; padding: 6px 0;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 7px;
      color: #7a8aaa; font-size: 13px; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      text-align: center;
    }
    .hud-btn:hover { background: rgba(230,160,50,0.15); color: #e6a032; border-color: rgba(230,160,50,0.3); }

    .hud-refresh {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px; color: #3d4d6a;
      margin-top: 8px; line-height: 1.7;
    }
    .hud-refresh b { color: #7a8aaa; font-weight: 500; }

    /* ── Leyenda de capas ── */
    .hud-legend {
      margin-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.07);
      padding-top: 8px;
    }
    .hud-legend-title {
      font-size: 9px; font-weight: 600; font-family: 'IBM Plex Mono', monospace;
      color: #3d4d6a; text-transform: uppercase; letter-spacing: 0.1em;
      margin-bottom: 6px;
    }
    .hud-legend-item {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; color: #7a8aaa;
      margin: 4px 0;
    }
    .hud-legend-item svg { flex-shrink: 0; }

    /* ── Leyenda SO₂ ── */
    .so2-scale {
      position: fixed;
      left: 16px; bottom: 24px;
      background: rgba(22, 27, 38, 0.95);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 6px 8px 4px;
      z-index: 800;
      transform: scale(0.52);
      transform-origin: bottom left;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    /* ── Marcadores volcán ── */
    .volcano-icon { background: transparent; border: none; box-shadow: none; }

    /* ── Tooltip: visible solo con zoom alto ── */
    .monitor-tooltip {
      background: rgba(10, 13, 26, 0.95) !important;
      border: 1px solid rgba(160,180,255,0.2) !important;
      border-radius: 4px !important;
      padding: 3px 8px !important;
      font-size: 11px !important; font-weight: 600 !important;
      color: #fff !important;
      white-space: nowrap !important;
      box-shadow: none !important;
      font-family: 'DM Sans', sans-serif !important;
    }
    .monitor-tooltip::before { display: none !important; }

    /* ── Overrides Leaflet ── */
    .leaflet-control-zoom {
      border: 1px solid rgba(255,255,255,0.09) !important;
      border-radius: 8px !important;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4) !important;
    }
    .leaflet-control-zoom a {
      background: rgba(22,27,38,0.96) !important;
      border-color: rgba(255,255,255,0.08) !important;
      color: #7a8aaa !important;
      font-size: 18px !important; font-weight: 400 !important;
      width: 34px !important; height: 34px !important;
      line-height: 34px !important;
    }
    .leaflet-control-zoom a:hover { color: #e6a032 !important; background: rgba(230,160,50,0.12) !important; }

    .leaflet-control-attribution {
      background: rgba(15,17,23,0.75) !important;
      color: #3d4d6a !important; font-size: 9px !important;
    }
    .leaflet-control-attribution a { color: #7a8aaa !important; }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-zone" id="hudZone">Chile Norte</div>
    <div class="hud-product">SO₂ · TROPOMI</div>

    <hr class="hud-sep" />

    <div class="hud-date" id="hudDate">—</div>
    <div class="hud-nav">
      <button class="hud-btn" id="btnPrev" title="Día anterior">&#8592;</button>
      <button class="hud-btn" id="btnHoy" title="Ir a hoy">Hoy</button>
      <button class="hud-btn" id="btnNext" title="Día siguiente">&#8594;</button>
    </div>

    <div class="hud-refresh">
      Actualizado: <b id="hudLastRefresh">—</b><br>
      Próx. refresh: <b id="hudNextRefresh">—</b><br>
      <span style="color:#2a3550">Datos disp. ~20:00 UTC</span>
    </div>

    <!-- Leyenda de capas -->
    <div class="hud-legend">
      <div class="hud-legend-title">Capas</div>
      <div class="hud-legend-item">
        <svg width="16" height="18" viewBox="0 0 16 18">
          <path d="M8,0 L0,18 L16,18 Z" fill="#4a5568" stroke="#1a202c" stroke-width="0.8"/>
          <path d="M8,0 L4.2,6.8 Q8,5 11.8,6.8 Z" fill="#e8eaf0" stroke="#9aa5b4" stroke-width="0.5"/>
        </svg>
        <span>Volcán OVDAS</span>
      </div>
      <div class="hud-legend-item">
        <svg width="14" height="15" viewBox="0 0 14 15">
          <polygon points="7,1 0,14 14,14" fill="#718096" stroke="#2d3748" stroke-width="0.8"/>
        </svg>
        <span>Volcán</span>
      </div>
      <div class="hud-legend-item">
        <svg width="14" height="14" viewBox="0 0 14 14">
          <circle cx="7" cy="7" r="5" fill="#111" stroke="#555" stroke-width="1.5"/>
        </svg>
        <span>Fundición</span>
      </div>
      <div class="hud-legend-item">
        <svg width="22" height="8" viewBox="0 0 22 8">
          <line x1="0" y1="4" x2="22" y2="4" stroke="#fff" stroke-width="1.5" stroke-opacity="0.5"/>
        </svg>
        <span>Límite Chile</span>
      </div>
    </div>
  </div>

  <!-- Escala SO₂ -->
  <div class="so2-scale">
    <svg xmlns="http://www.w3.org/2000/svg" width="130" height="195" viewBox="0 0 130 195">
      <rect x="0" y="0" width="130" height="195" fill="#161b26" rx="2"/>
      <text x="8" y="16" font-size="14" font-weight="600" fill="#e2e8f0"
            font-family="IBM Plex Mono,monospace">SO₂ (DU)</text>
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#c00000"/>
          <stop offset="18%"  stop-color="#e87820"/>
          <stop offset="36%"  stop-color="#e8c000"/>
          <stop offset="50%"  stop-color="#40c878"/>
          <stop offset="62%"  stop-color="#40a0d8"/>
          <stop offset="76%"  stop-color="#8080c8"/>
          <stop offset="92%"  stop-color="#e8d5e8"/>
          <stop offset="100%" stop-color="#ffffff"/>
        </linearGradient>
      </defs>
      <rect x="10" y="22" width="40" height="155" fill="url(#g)" stroke="#555" stroke-width="0.5"/>
      <line x1="52" y1="22"  x2="60" y2="22"  stroke="#3d4d6a" stroke-width="1.2"/>
      <text x="64" y="26"  font-size="12" fill="#7a8aaa" font-family="IBM Plex Mono,monospace">10.0</text>
      <line x1="52" y1="60"  x2="60" y2="60"  stroke="#3d4d6a" stroke-width="1.2"/>
      <text x="64" y="64"  font-size="12" fill="#7a8aaa" font-family="IBM Plex Mono,monospace">3.3</text>
      <line x1="52" y1="100" x2="60" y2="100" stroke="#3d4d6a" stroke-width="1.2"/>
      <text x="64" y="104" font-size="12" fill="#7a8aaa" font-family="IBM Plex Mono,monospace">1.1</text>
      <line x1="52" y1="132" x2="60" y2="132" stroke="#3d4d6a" stroke-width="1.2"/>
      <text x="64" y="136" font-size="12" fill="#7a8aaa" font-family="IBM Plex Mono,monospace">0.3</text>
      <line x1="52" y1="177" x2="60" y2="177" stroke="#3d4d6a" stroke-width="1.2"/>
      <text x="64" y="181" font-size="12" fill="#7a8aaa" font-family="IBM Plex Mono,monospace">0</text>
    </svg>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="src/config.js"></script>
  <script>
  /* global APP_CONFIG, L */
  (function () {
    "use strict";
    const cfg = window.APP_CONFIG;

    // ── Zonas ──────────────────────────────────────────────────────────────
    const params  = new URLSearchParams(window.location.search);
    const zonaKey = (params.get("zona") || "norte").toLowerCase();

    const ZONAS = {
      norte: {
        label:  "Chile Norte",
        bounds: [[-35.5, -73.5], [-17.0, -61.5]],
      },
      sur: {
        label:  "Chile Sur",
        bounds: [[-56.0, -76.5], [-35.5, -64.0]],
      },
    };
    const zona = ZONAS[zonaKey] || ZONAS.norte;
    document.title = `SO₂ Monitor · ${zona.label}`;
    document.getElementById("hudZone").textContent = zona.label;

    // ── Fecha inteligente ──────────────────────────────────────────────────
    // El producto L3 P1D de EOC/DLR está disponible ~20:00 UTC.
    // Antes de esa hora mostramos ayer (datos seguros); después, hoy.
    const EOC_UPDATE_HOUR_UTC = 20;

    function smartDate() {
      const now = new Date();
      const d   = new Date(now);
      if (now.getUTCHours() < EOC_UPDATE_HOUR_UTC) {
        d.setUTCDate(d.getUTCDate() - 1);
      }
      return d.toISOString().slice(0, 10);
    }

    function shiftDate(dateStr, days) {
      const d = new Date(dateStr + "T00:00:00Z");
      d.setUTCDate(d.getUTCDate() + days);
      return d.toISOString().slice(0, 10);
    }

    function fmtUtc(d) {
      return String(d.getUTCHours()).padStart(2,"0") + ":" +
             String(d.getUTCMinutes()).padStart(2,"0") + " UTC";
    }

    let currentDate = params.get("fecha") || smartDate();

    // ── Mapa (zoom en bottom-right, sin control por defecto) ───────────────
    const map = L.map("map", { zoomControl: false })
      .fitBounds(zona.bounds);

    L.control.zoom({ position: "bottomright" }).addTo(map);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 12,
      attribution: "&copy; OpenStreetMap · DLR EOC · TROPOMI/ESA"
    }).addTo(map);

    // ── WMS SO₂ ────────────────────────────────────────────────────────────
    let so2Layer = null;

    function loadSo2(dateStr) {
      if (so2Layer) map.removeLayer(so2Layer);
      const p = {
        layers:      cfg.wms.layers,
        format:      cfg.wms.format,
        transparent: cfg.wms.transparent,
        version:     cfg.wms.version,
        time:        `${dateStr}T05:00:00Z`,
        opacity:     0.85,
      };
      if (cfg.wms.styles !== undefined) p.styles = cfg.wms.styles;
      so2Layer = L.tileLayer.wms(cfg.wms.url, p).addTo(map);
    }

    // ── Iconos ─────────────────────────────────────────────────────────────
    function ovdasIcon(sz) {
      const w = sz, h = Math.round(sz * 1.15), cx = w / 2, sw = Math.max(0.5, sz / 20);
      return L.divIcon({
        className: "volcano-icon",
        html: `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
          <path d="M${cx},0 L0,${h} L${w},${h} Z" fill="#4a5568" stroke="#1a202c" stroke-width="${sw}" stroke-linejoin="round"/>
          <path d="M${cx},0 L${cx*.52},${h*.38} Q${cx},${h*.28} ${cx*1.48},${h*.38} Z" fill="#e8eaf0" stroke="#9aa5b4" stroke-width="${sw*.5}"/>
        </svg>`,
        iconSize: [w, h], iconAnchor: [Math.round(w / 2), h],
      });
    }
    function otherIcon(sz) {
      const w = sz, h = Math.round(sz * 1.1), sw = Math.max(0.5, sz / 12);
      return L.divIcon({
        className: "volcano-icon",
        html: `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
          <polygon points="${w/2},0 0,${h} ${w},${h}" fill="#718096" stroke="#2d3748" stroke-width="${sw}" stroke-linejoin="round"/>
        </svg>`,
        iconSize: [w, h], iconAnchor: [Math.round(w / 2), h],
      });
    }

    function nameOf(props) {
      return (props && (props.name || props.Name || props.NOMBRE)) || "";
    }

    // ── Capas GeoJSON con zoom-gated labels ────────────────────────────────
    // Las etiquetas son permanentes pero se muestran/ocultan según zoom.
    // Umbrales: OVDAS >= 7, otros/fundiciones >= 9
    const ZOOM_OVDAS   = 7;
    const ZOOM_OTHER   = 9;

    let ovdasLayer  = null;
    let otrosLayer  = null;
    let smelterLayer = null;

    async function loadGeoJson(url, pointFn, zoomThreshold) {
      try {
        const r = await fetch(new URL(url, document.baseURI).toString(), { cache: "no-store" });
        if (!r.ok) return null;
        const gj = await r.json();
        const layer = L.geoJSON(gj, {
          pointToLayer: (f, ll) => pointFn(ll, f),
          onEachFeature: (f, lyr) => {
            const name = nameOf(f.properties);
            if (!name) return;
            lyr.bindTooltip(name, {
              permanent: true,
              direction: "top",
              offset: [0, -10],
              opacity: 1,
              className: "monitor-tooltip",
            });
          },
        }).addTo(map);
        layer._zoomThreshold = zoomThreshold;
        return layer;
      } catch (e) {
        console.warn("GeoJSON no cargado:", url, e);
        return null;
      }
    }

    async function loadBorder() {
      try {
        const r = await fetch(cfg.data.countriesUrl, { cache: "force-cache" });
        if (!r.ok) return;
        const gj = await r.json();
        const chile = {
          type: "FeatureCollection",
          features: (gj.features || []).filter(f => {
            const p = f.properties || {};
            return cfg.data.chileNamePropertyCandidates.some(
              k => p[k] && String(p[k]).toLowerCase() === "chile"
            );
          }),
        };
        L.geoJSON(chile, {
          style: { color: "#ffffff", weight: 1.5, fillOpacity: 0, opacity: 0.45 }
        }).addTo(map);
      } catch (e) { console.warn("Borde no cargado:", e); }
    }

    // Muestra/oculta tooltips según el zoom actual
    function updateLabels() {
      const z = map.getZoom();
      [ovdasLayer, otrosLayer, smelterLayer].forEach(layer => {
        if (!layer) return;
        const threshold = layer._zoomThreshold ?? 8;
        layer.eachLayer(l => {
          const t = l.getTooltip?.();
          if (!t) return;
          if (z >= threshold) l.openTooltip();
          else                l.closeTooltip();
        });
      });
    }
    map.on("zoomend", updateLabels);

    // ── HUD: fecha y navegación ────────────────────────────────────────────
    function setDate(dateStr) {
      currentDate = dateStr;
      document.getElementById("hudDate").textContent = currentDate;
      loadSo2(currentDate);
    }

    document.getElementById("btnPrev").addEventListener("click", () => setDate(shiftDate(currentDate, -1)));
    document.getElementById("btnNext").addEventListener("click", () => setDate(shiftDate(currentDate, +1)));
    document.getElementById("btnHoy").addEventListener("click", () => setDate(smartDate()));

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft")  setDate(shiftDate(currentDate, -1));
      if (e.key === "ArrowRight") setDate(shiftDate(currentDate, +1));
      if (e.key === "Home")       setDate(smartDate());
    });

    // ── Auto-refresh ───────────────────────────────────────────────────────
    const REFRESH_MS = 30 * 60 * 1000;   // cada 30 min
    let nextRefreshAt = Date.now() + REFRESH_MS;

    function doRefresh() {
      // Recompute smart date (puede que ya pasó 20:00 UTC → cambiar a hoy)
      const newDate = smartDate();
      setDate(newDate);
      const now = new Date();
      document.getElementById("hudLastRefresh").textContent = fmtUtc(now);
      nextRefreshAt = Date.now() + REFRESH_MS;
    }

    // Countdown cada segundo
    setInterval(() => {
      const secsLeft = Math.max(0, Math.round((nextRefreshAt - Date.now()) / 1000));
      const m = String(Math.floor(secsLeft / 60)).padStart(2, "0");
      const s = String(secsLeft % 60).padStart(2, "0");
      document.getElementById("hudNextRefresh").textContent = `${m}:${s}`;
    }, 1000);

    // Refresh periódico
    setInterval(doRefresh, REFRESH_MS);

    // Refresh programado a las 20:15 UTC (cuando los datos del día están disponibles)
    function scheduleEocRefresh() {
      const now = new Date();
      const target = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(),
                              now.getUTCDate(), 20, 15, 0));
      if (target <= now) target.setUTCDate(target.getUTCDate() + 1);
      const ms = target - now;
      setTimeout(() => {
        doRefresh();
        scheduleEocRefresh();   // reprogramar para mañana
      }, ms);
    }
    scheduleEocRefresh();

    // ── Init ───────────────────────────────────────────────────────────────
    async function init() {
      setDate(currentDate);

      await Promise.all([
        loadBorder(),
        loadGeoJson(
          cfg.data.volcanoesOvdas,
          ll => L.marker(ll, { icon: ovdasIcon(24) }),
          ZOOM_OVDAS
        ).then(l => { ovdasLayer = l; }),
        loadGeoJson(
          cfg.data.volcanoesAll,
          ll => L.marker(ll, { icon: otherIcon(13) }),
          ZOOM_OTHER
        ).then(l => { otrosLayer = l; }),
        loadGeoJson(
          cfg.data.smelters,
          ll => L.circleMarker(ll, { radius: 7, weight: 1.5, fillOpacity: 0.9, color: "#000", fillColor: "#111" }),
          ZOOM_OTHER
        ).then(l => { smelterLayer = l; }),
      ]);

      updateLabels();   // aplicar visibilidad inicial según zoom de arranque

      // HUD inicial
      const now = new Date();
      document.getElementById("hudLastRefresh").textContent = fmtUtc(now);
    }

    init();
  })();
  </script>
</body>
</html>
