name: PR Preview (GitHub Pages)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build preview artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare preview bundle
        run: |
          mkdir -p _site
          rsync -a ./ ./_site \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "_site" \
            --exclude "jobs" \
            --exclude "scripts" \
            --exclude "data/gifs" \
            --exclude "data/wind"

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    needs: build-preview
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (preview)
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          preview: true

      - name: Comment preview URL on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.page_url }}
        with:
          script: |
            const marker = '<!-- so2-preview-url -->';
            const body = `${marker}\n🔎 **Preview del visor lista**\n\nURL: ${process.env.PREVIEW_URL}\n\n_Se actualiza automáticamente con cada commit del PR._`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
