name: Extract SO2 (daily)

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC, archivos EOC disponibles ~04:00 UTC
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Días hacia atrás a procesar (1 = solo ayer)"
        required: false
        default: "1"
      force:
        description: "Recalcular fechas ya procesadas (true para backfill completo)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet \
            rasterio \
            numpy \
            scipy \
            requests

      - name: Run extraction (daily)
        if: github.event_name == 'schedule'
        run: python scripts/extract_so2.py

      - name: Run extraction (manual / backfill)
        if: github.event_name == 'workflow_dispatch'
        run: |
          DAYS="${{ github.event.inputs.backfill_days }}"
          FORCE="${{ github.event.inputs.force }}"
          ARGS=""
          [ "$DAYS" -gt "1" ] && ARGS="--backfill $DAYS"
          [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
          python scripts/extract_so2.py $ARGS

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/so2_history.db data/so2_stats.json data/plumes/
          git diff --cached --quiet || \
            git commit -m "SO2 extract $(date -u +%Y-%m-%d)"
          git push
