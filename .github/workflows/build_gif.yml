name: Build SO₂ GIF

on:
  workflow_dispatch:
    inputs:
      job_path:
        description: "Ruta del job JSON dentro del repo (ej: jobs/gif_job.json)"
        required: true
        default: "jobs/gif_job.json"

permissions:
  contents: write

jobs:
  build-gif:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow

      - name: Validate job exists
        run: |
          set -euo pipefail
          if [ ! -f "${{ github.event.inputs.job_path }}" ]; then
            echo "Job file not found: ${{ github.event.inputs.job_path }}"
            exit 1
          fi
          echo "Using job: ${{ github.event.inputs.job_path }}"
          echo "----"
          cat "${{ github.event.inputs.job_path }}"
          echo "----"

      - name: Build GIF
        run: |
          set -euo pipefail
          python scripts/build_gif.py "${{ github.event.inputs.job_path }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: so2-gif
          path: |
            data/gifs/**/*.gif
            data/gifs/**/*.json

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain data/gifs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/gifs
            git commit -m "Add SO2 GIF"
            git push
          else
            echo "No changes in data/gifs"
          fi
